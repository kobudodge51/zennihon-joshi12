<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第12回全日本女子総合ドッジボール選手権 大会結果</title>
<meta name="description" content="第12回全日本女子総合ドッジボール選手権（2025年12月7日・滋賀ダイハツアリーナ）D-1Gの部・S-1Gの部の予選リーグ・決勝トーナメント・最終順位">
<meta name="theme-color" content="#E04A86">
<meta property="og:title" content="第12回全日本女子総合ドッジボール選手権 大会結果">
<meta property="og:description" content="2025年12月7日（日）滋賀ダイハツアリーナ｜D-1G 36チーム・S-1G 20チームの全試合結果">
<meta property="og:image" content="img/logo.webp">
<script>(function(){var t=null;try{t=localStorage.getItem('jw-theme')}catch(e){}if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Oswald:wght@600&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<div id="intro" aria-hidden="true">
  <div class="fx"></div><div class="ring"></div>
  <div class="stage">
    <img class="lg" src="img/logo.webp" alt="" width="864" height="713">
    <div class="t1">第12回 全日本女子総合<br>ドッジボール選手権</div>
    <div class="t2">2025.12.7 SUN ｜ 滋賀ダイハツアリーナ</div>
    <div class="stamp">大会結果</div>
  </div>
  <button type="button" class="skip">SKIP ▸</button>
</div>
<script>(function(){var el=document.getElementById('intro');if(!el)return;var R=Math.random,h='',i;
for(i=0;i<40;i++){var z=(2+R()*5).toFixed(1);h+='<i style="left:'+(R()*100).toFixed(1)+'%;width:'+z+'px;height:'+z+'px;--t:'+(2.4+R()*3).toFixed(2)+'s;--dl:-'+(R()*4).toFixed(2)+'s;--dx:'+(R()*80-40).toFixed(0)+'px"></i>'}
el.querySelector('.fx').innerHTML=h;
document.documentElement.style.overflow='hidden';var done=false,started=false;
function end(){if(done)return;done=true;el.classList.add('out');document.documentElement.style.overflow='';setTimeout(function(){el.remove()},900)}
el.addEventListener('click',end);
function go(){if(started)return;started=true;el.classList.add('go');setTimeout(end,4000)}
var im=el.querySelector('img');if(im.complete)go();else{im.onload=go;im.onerror=go}
setTimeout(go,1500);setTimeout(end,8000)})();</script>
<div id="app"></div>
<script src="data.js?v=3"></script>
<script src="app.js?v=8"></script>
</body>
</html>
